[package]
name = "sandogasa-fasjson"
description = "FASJSON (Fedora Account System) API client with Kerberos auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Registers the rustls provider directly; `tls` is not implied
# here because this crate does not use the `http` module.
sandogasa-cli = { workspace = true, features = ["tls"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
