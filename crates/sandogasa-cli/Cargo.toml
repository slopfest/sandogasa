[package]
name = "sandogasa-cli"
description = "Shared CLI utilities for sandogasa tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
clap_mangen = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true }
sandogasa-config = { workspace = true }
serde = { workspace = true, optional = true }
toml = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# HTTP plumbing shared by the API-client crates (the `http` module):
# preconfigured reqwest builders and uniform status/JSON handling.
# Off by default so network-free tools don't pull in reqwest.
http = ["dep:reqwest", "dep:serde"]

# Man page generation from the clap definition (the `man` module).
# Off by default and enabled as a dev-dependency by the tools, so
# shipped binaries do not carry the roff renderer.
man = ["dep:clap_mangen"]
