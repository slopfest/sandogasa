# Attach the PDF of each talk a release adds or changes to that
# release (#145). The PDFs are build output, so git never has them;
# the release is where a reader finds the slides as given.
#
# Triggered by the tag push, as release.yml is, and not by the release
# being published: release.yml publishes it with GITHUB_TOKEN, and an
# event that token causes starts no workflow. The release is created
# as a draft right after the tag push (see CLAUDE.md), so the upload
# waits for it, the way release.yml's own upload does.
name: Talks

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach talks for'
        required: true

permissions:
  contents: write

env:
  TYPST_VERSION: '0.15.1'
  # GitHub's published digest for typst-x86_64-unknown-linux-musl.tar.xz.
  TYPST_SHA256: 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c'

jobs:
  talks:
    name: build and attach talk PDFs
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The previous tag, to tell which talks changed.
          fetch-depth: 0

      - name: Find the talks this release adds or changes
        id: changed
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          # Every talk is new to the first release.
          if [ -n "$prev" ]; then
            files=$(git diff --name-only "$prev" "$TAG" -- talks/)
          else
            files=$(git ls-tree -r --name-only "$TAG" -- talks/)
          fi
          # A talk removed by the release has nothing to build.
          talks=$(echo "$files" | awk -F/ 'NF > 2 { print "talks/" $2 }' | sort -u \
            | while read -r d; do [ -d "$d" ] && echo "$d"; done | tr '\n' ' ')
          echo "Talks changed since ${prev:-the start}: ${talks:-none}"
          echo "talks=$talks" >> "$GITHUB_OUTPUT"

      - name: Install typst
        if: steps.changed.outputs.talks != ''
        run: |
          curl -sSLf -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$TYPST_SHA256  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz
          sudo install -m 755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl
          typst --version

      - name: Build
        if: steps.changed.outputs.talks != ''
        run: make talks TALK="${{ steps.changed.outputs.talks }}"

      - name: Wait for the release
        if: steps.changed.outputs.talks != ''
        run: |
          for _ in $(seq 60); do
            gh release view "$TAG" > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "No release for $TAG after 10 minutes: create it, then re-run this job" >&2
          exit 1

      - name: Attach
        if: steps.changed.outputs.talks != ''
        run: |
          for d in ${{ steps.changed.outputs.talks }}; do
            gh release upload "$TAG" --clobber "$d/$(basename "$d").pdf"
          done
