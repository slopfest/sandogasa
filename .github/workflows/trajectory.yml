# Attach the development trajectory report (#20) to each release: every
# release tag up to this one, measured and drawn by
# scripts/build-trajectory.sh. The PDF is build output, so git never has
# it; the release is where a reader finds it.
#
# Triggered by the tag push, as talks.yml is, and for the same reason:
# release.yml publishes the release with GITHUB_TOKEN, and an event that
# token causes starts no workflow. The release is created as a draft
# right after the tag push (see CLAUDE.md), so the upload waits for it.
#
# The public report carries only coarse shares of when commits were
# made; the weekday x hour heatmap (PRIVATE=1) is never built here.
name: Trajectory

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the trajectory report for'
        required: true

permissions:
  contents: write

env:
  TYPST_VERSION: '0.15.1'
  # GitHub's published digest for typst-x86_64-unknown-linux-musl.tar.xz.
  TYPST_SHA256: 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c'
  # The tokei Fedora ships, so CI counts lines as a maintainer's machine does.
  TOKEI_VERSION: '15.0.0'

jobs:
  trajectory:
    name: build and attach the trajectory report
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Every earlier tag and commit, which the report measures.
          fetch-depth: 0

      - name: Install tokei
        run: |
          cargo install tokei --version "$TOKEI_VERSION" --locked
          tokei --version

      - name: Install typst
        run: |
          curl -sSLf -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$TYPST_SHA256  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz
          sudo install -m 755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl
          typst --version

      - name: Build
        run: |
          make trajectory UNTIL="$TAG"
          cp reports/trajectory/trajectory.pdf "sandogasa-trajectory-$TAG.pdf"

      - name: Wait for the release
        run: |
          for _ in $(seq 60); do
            gh release view "$TAG" > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "No release for $TAG after 10 minutes: create it, then re-run this job" >&2
          exit 1

      - name: Attach
        run: gh release upload "$TAG" --clobber "sandogasa-trajectory-$TAG.pdf"
