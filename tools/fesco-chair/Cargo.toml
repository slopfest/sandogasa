[package]
name = "fesco-chair"
description = "FESCo meeting chair helper — agenda email, day-of script, summary email"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
# Registers the rustls provider directly; `tls` is not implied
# here because this crate does not use the `http` module.
sandogasa-cli = { workspace = true, features = ["tls"] }
sandogasa-config = { workspace = true }
sandogasa-forgejo = { workspace = true }
sandogasa-meetbot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
sandogasa-build = { workspace = true }

[dev-dependencies]
sandogasa-cli = { workspace = true, features = ["man"] }
tempfile = { workspace = true }
