[package]
name = "cbspkg"
description = "Package and build for CentOS SIGs in CBS, the way fedpkg does for Fedora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
sandogasa-cbs = { workspace = true }
sandogasa-cli = { workspace = true, features = ["explain", "http"] }
sandogasa-config = { workspace = true }
sandogasa-gitlab = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
sandogasa-build = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
sandogasa-cli = { workspace = true, features = ["man"] }
sandogasa-config = { workspace = true, features = ["test-support"] }
serial_test = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
