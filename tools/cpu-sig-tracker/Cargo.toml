[package]
name = "cpu-sig-tracker"
description = "Track CentOS Proposed Updates SIG package state across Koji, GitLab and JIRA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
sandogasa-cbs = { workspace = true }
sandogasa-cli = { workspace = true, features = ["explain"] }
sandogasa-config = { workspace = true }
sandogasa-cve = { workspace = true }
sandogasa-fedrq = { workspace = true }
sandogasa-gitlab = { workspace = true }
sandogasa-inventory = { workspace = true }
sandogasa-jira = { workspace = true }
sandogasa-koji = { workspace = true }
sandogasa-kojihub = { workspace = true }
sandogasa-rpmvercmp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[build-dependencies]
sandogasa-build = { workspace = true }

[dev-dependencies]
sandogasa-cli = { workspace = true, features = ["man"] }
serial_test = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
