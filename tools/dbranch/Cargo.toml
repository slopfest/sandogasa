[package]
name = "dbranch"
version.workspace = true
description = "Propagate a Debian package across its Ubuntu PPA and Debian branches"
edition.workspace = true
license.workspace = true
repository.workspace = true

# Shipped as a prebuilt binary for `cargo binstall`; see
# `[workspace.metadata.dist]` in the root Cargo.toml.
[package.metadata.dist]
dist = true

[dependencies]
anstream = { workspace = true }
anstyle = { workspace = true }
clap = { workspace = true }
# No `tls` feature: dbranch shells out to the Debian tools and makes
# no HTTP requests. Shedding ring's C and assembly with it is what
# lets the release build target musl with no C toolchain.
sandogasa-cli = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
sandogasa-build = { workspace = true }

[dev-dependencies]
sandogasa-cli = { workspace = true, features = ["man"] }
tempfile = { workspace = true }
