[workspace]
resolver = "3"
members = [
    "crates/sandogasa-bodhi",
    "crates/sandogasa-bugclass",
    "crates/sandogasa-build",
    "crates/sandogasa-bugzilla",
    "crates/sandogasa-cli",
    "crates/sandogasa-closure",
    "crates/sandogasa-config",
    "crates/sandogasa-copr",
    "crates/sandogasa-depfilter",
    "crates/sandogasa-discourse",
    "crates/sandogasa-distgit",
    "crates/sandogasa-fasjson",
    "crates/sandogasa-fedrq",
    "crates/sandogasa-forgejo",
    "crates/sandogasa-github",
    "crates/sandogasa-gitlab",
    "crates/sandogasa-inventory",
    "crates/sandogasa-jira",
    "crates/sandogasa-koji",
    "crates/sandogasa-kojihub",
    "crates/sandogasa-mailman",
    "crates/sandogasa-meetbot",
    "crates/sandogasa-nvd",
    "crates/sandogasa-repology",
    "crates/sandogasa-review",
    "crates/sandogasa-rpmvercmp",
    "crates/sandogasa-sourcehut",
    "tools/cpu-sig-tracker",
    "tools/dbranch",
    "tools/ebranch",
    "tools/fedora-cve-triage",
    "tools/fedora-review-digest",
    "tools/fesco-chair",
    "tools/hs-intake",
    "tools/hs-meetings",
    "tools/koji-diff",
    "tools/koji-lag",
    "tools/hs-relmon",
    "tools/sandogasa-hattrack",
    "tools/poi-tracker",
    "tools/sandogasa-pkg-acl",
    "tools/sandogasa-pkg-health",
    "tools/sandogasa-report",
]

# sandogasa (菅笠, a Japanese straw hat) is often associated with
# "slum" or post-apocalyptic robots in popular culture.

[workspace.package]
version = "0.22.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/slopfest/sandogasa"

# Prebuilt binaries attached to GitHub releases, for `cargo binstall`.
# Only dbranch ships this way for now: it is the one tool useful on
# Debian and Ubuntu, where sandogasa is not packaged. `dist = false`
# here opts the whole workspace out; a tool ships by setting
# `[package.metadata.dist] dist = true` in its own Cargo.toml.
#
# musl rather than glibc because the audience runs a spread of
# distributions and a glibc-2.39 binary from the runner image will not
# start on EL9. Nothing here links OpenSSL — reqwest is configured for
# rustls throughout — so a static build costs nothing.
#
# `create-release = false` keeps the release page ours: dist uploads
# into a draft release that already exists for the tag, rather than
# generating a title and body from CHANGELOG.md over the tag message
# written for it.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
dist = false
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
installers = []
create-release = false

# Build dbranch alone rather than the default `cargo build
# --workspace`. A workspace build unifies features across all sixteen
# tools, which would switch sandogasa-cli's `tls` feature on and link
# ring into dbranch after all — and ring compiles C, which is the one
# thing that would make a musl target need a C toolchain on the runner.
# Building the one app we ship keeps its dependency tree pure Rust.
precise-builds = true

# The profile cargo-dist builds releases with.
[profile.dist]
inherits = "release"
lto = "thin"

# Dev builds carry line tables instead of full DWARF. A workspace of
# this size wrote tens of gigabytes of debuginfo into target/debug,
# enough to run a machine out of disk, and what it bought was variable
# inspection under a debugger — not how anything here gets diagnosed.
# Backtraces keep their file and line numbers. Release builds, which is
# what distro packaging drives, are untouched.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
anstream = "1"
anstyle = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_mangen = "0.2"
dashmap = "6"
dirs = "6"
emojis = "0.9"
mockito = "1"
quick-xml = "0.41"
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "query", "rustls-no-provider", "http2"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = { version = "1", features = ["chrono04"] }
sandogasa-bodhi = { version = "0.22", path = "crates/sandogasa-bodhi" }
sandogasa-bugclass = { version = "0.22", path = "crates/sandogasa-bugclass" }
sandogasa-build = { version = "0.22", path = "crates/sandogasa-build" }
sandogasa-bugzilla = { version = "0.22", path = "crates/sandogasa-bugzilla" }
# `default-features = false` so a member that needs no TLS does not
# get one: cargo forbids a member turning off a default its workspace
# dependency enabled, so the choice has to be made here. The `tls`
# feature is still on by default for anyone depending on the published
# crate; `http` implies it, so the API-client crates need nothing, and
# the few crates that register the provider without using `http` ask
# for `tls` by name.
sandogasa-cli = { version = "0.22", path = "crates/sandogasa-cli", default-features = false }
sandogasa-closure = { version = "0.22", path = "crates/sandogasa-closure" }
sandogasa-config = { version = "0.22", path = "crates/sandogasa-config" }
sandogasa-copr = { version = "0.22", path = "crates/sandogasa-copr" }
sandogasa-depfilter = { version = "0.22", path = "crates/sandogasa-depfilter" }
sandogasa-discourse = { version = "0.22", path = "crates/sandogasa-discourse" }
sandogasa-distgit = { version = "0.22", path = "crates/sandogasa-distgit" }
sandogasa-fasjson = { version = "0.22", path = "crates/sandogasa-fasjson" }
sandogasa-fedrq = { version = "0.22", path = "crates/sandogasa-fedrq" }
sandogasa-forgejo = { version = "0.22", path = "crates/sandogasa-forgejo" }
sandogasa-github = { version = "0.22", path = "crates/sandogasa-github" }
sandogasa-gitlab = { version = "0.22", path = "crates/sandogasa-gitlab" }
sandogasa-inventory = { version = "0.22", path = "crates/sandogasa-inventory" }
sandogasa-jira = { version = "0.22", path = "crates/sandogasa-jira" }
sandogasa-koji = { version = "0.22", path = "crates/sandogasa-koji" }
sandogasa-kojihub = { version = "0.22", path = "crates/sandogasa-kojihub" }
sandogasa-mailman = { version = "0.22", path = "crates/sandogasa-mailman" }
sandogasa-meetbot = { version = "0.22", path = "crates/sandogasa-meetbot" }
sandogasa-nvd = { version = "0.22", path = "crates/sandogasa-nvd" }
sandogasa-repology = { version = "0.22", path = "crates/sandogasa-repology" }
sandogasa-review = { version = "0.22", path = "crates/sandogasa-review" }
sandogasa-rpmvercmp = { version = "0.22", path = "crates/sandogasa-rpmvercmp" }
sandogasa-sourcehut = { version = "0.22", path = "crates/sandogasa-sourcehut" }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
rusqlite = "0.38"
serde_json = "1.0"
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25"
url = "2"
version-compare = "0.2"
wait-timeout = "0.2"
wiremock = "0.6"
