#
# Spelling check for `make spell` (typos-cli). Project text uses en-US
# spelling; the locale makes typos report en-GB spellings too.

[default]
locale = "en-us"
extend-ignore-re = [
  # Upstream license file names matched literally (ebranch bundled.rs)
  '(?i)[`"](un)?licence[^`"]*[`"]',
  # Ids, such as Jira account ids and Bodhi update aliases
  '\b[0-9a-z]*[0-9][0-9a-z]*\b',
  # Bugzilla's "ANDed" query terms
  '\bANDed\b',
  # A deliberately misspelled flag in sandogasa-cli's tests
  '\bexplian\b',
]

[default.extend-identifiers]
# Public variant of sandogasa-bugzilla's LoginCheck; renaming it breaks
# callers, so it waits for the next breaking release
NotRecognised = "NotRecognised"

[default.extend-words]
# Names, not misspellings
aer = "aer"                  # PCIe AER, a rasdaemon option (specport tests)
astroid = "astroid"          # a Python package
Automattic = "Automattic"    # the company
buildd = "buildd"            # Debian's build daemon
buildds = "buildds"
cna = "cna"                  # CVE Numbering Authority
CNA = "CNA"
debbugs = "debbugs"          # Debian's bug tracker
hpe = "hpe"                  # an NVD vendor name
IST = "IST"                  # a time-zone abbreviation
MENA = "MENA"                # Middle East and North Africa
noteable = "noteable"        # GitLab's API field name
# en-US accepts these spellings
queueing = "queueing"
unparseable = "unparseable"
# koji-lag's JSON field and metric name (health and trend reports, read
# by its notebooks); renaming it would break saved reports
utilisation = "utilisation"
# en-GB spellings typos does not know
deprioritised = "deprioritized"
mislabelled = "mislabeled"
relabelled = "relabeled"
serialisable = "serializable"
unmodelled = "unmodeled"

[files]
# .claude/ and .github/ hold project text too
ignore-hidden = false
extend-exclude = [
  ".git/",
  # Released entries are not edited
  "CHANGELOG.md",
  # Vendored or generated by others
  "crates/sandogasa-sourcehut/schema/*.graphqls",
  "tools/sandogasa-hattrack/data/zone1970.tab",
  # Real spec files from CentOS Stream, used as test fixtures as they are
  "crates/sandogasa-distgit/testdata/*.spec",
  # Package names
  "configs/rpmfusion/inventory.toml",
  # Notebook output
  "*.ipynb",
]
