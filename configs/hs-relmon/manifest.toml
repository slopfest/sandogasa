# Default settings applied to all packages unless overridden.
#
# Per package, `divergent = true` says the SIG copy carries packaging
# changes of its own, so when stock catches up it is rebased, not
# retired; `false` says it is tracked only until stock catches up.
# `hs-relmon check-stock` asks for the field where it is unset.
[defaults]
distros = "upstream,fedora,centos,hyperscale"
track = "centos"
file_issue = true

